<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 OTP 번호 확인</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center border border-slate-700">
        <h1 class="text-xl font-bold text-slate-300 mb-2">실시간 관리자 OTP</h1>
        <p class="text-xs text-slate-400 mb-6">GitHub Actions에 의해 5분마다 자동으로 변경됩니다.</p>
        
        <div class="bg-slate-950 p-6 rounded-xl border border-slate-800 my-4">
            <span id="otp-display" class="text-4xl font-extrabold tracking-widest text-sky-400 font-mono">로딩 중...</span>
        </div>

        <div id="status-text" class="text-xs text-slate-500 mt-4">Deno 서버 연결 중...</div>
    </div>

    <script>
        const BACKEND_URL = "https://mad-cheetah-6907.ktxsubway.deno.net";

        async function fetchOtp() {
            try {
                const res = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action: "getOtp" })
                });

                const data = await res.json();

                if (data.success && data.otp) {
                    document.getElementById("otp-display").innerText = data.otp;
                    const time = new Date().toLocaleTimeString();
                    document.getElementById("status-text").innerText = `마지막 동기화 시각: ${time}`;
                } else {
                    document.getElementById("status-text").innerText = "OTP 불러오기 실패: " + (data.message || "알 수 없는 오류");
                }
            } catch (error) {
                console.error("Deno 서버 통신 오류:", error);
                document.getElementById("status-text").innerText = "서버 연결 실패 (Deno 통신 오류)";
            }
        }

        // 1. 페이지 로드 시 즉시 OTP 불러오기
        fetchOtp();

        // 2. 10초마다 자동으로 Deno 백엔드에서 최신 OTP 동기화
        setInterval(fetchOtp, 10000);
    </script>
</body>
</html>
